# Garda Station Solicitors - PRODUCTION .htaccess (task #123yxuagbe8)
# Copied to dist/.htaccess by build.js when STAGING=0.
# Target platform: SiteGround (Apache + PHP).

Options -Indexes
ErrorDocument 404 /404.html

# ---------------------------------------------------------------- redirects
RewriteEngine On

# Force HTTPS (SiteGround terminates TLS in front of Apache; the HTTPS var is
# populated correctly on their stack).
RewriteCond %{HTTPS} !=on
RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

# Canonical host - ENABLE EXACTLY ONE BLOCK once Art's domain decision lands,
# and keep it in sync with DOMAIN= passed to build.js.
#
# A) canonical www:
# RewriteCond %{HTTP_HOST} !^www\. [NC]
# RewriteRule ^(.*)$ https://www.%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
#
# B) canonical bare domain:
# RewriteCond %{HTTP_HOST} ^www\.(.+)$ [NC]
# RewriteRule ^(.*)$ https://%1%{REQUEST_URI} [R=301,L]

# ------------------------------------------------------------------ caching
# Assets are content-hashed by name changes only, so: long cache on assets,
# no-cache on HTML (deploys must be visible immediately - caching has masked
# deploys on this account before; see deploy/DEPLOY.md for the purge drill).
<IfModule mod_expires.c>
  ExpiresActive On
  ExpiresByType image/webp  "access plus 1 year"
  ExpiresByType image/jpeg  "access plus 1 year"
  ExpiresByType image/png   "access plus 1 year"
  ExpiresByType text/css    "access plus 1 month"
  ExpiresByType text/javascript "access plus 1 month"
</IfModule>
<IfModule mod_headers.c>
  <FilesMatch "\.(webp|jpe?g|png)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
  </FilesMatch>
  <FilesMatch "\.(css|js)$">
    Header set Cache-Control "public, max-age=2592000"
  </FilesMatch>
  <FilesMatch "\.(html|xml|txt)$">
    Header set Cache-Control "no-cache, must-revalidate"
  </FilesMatch>

  # --------------------------------------------------------------- security
  Header set X-Content-Type-Options "nosniff"
  Header set X-Frame-Options "SAMEORIGIN"
  Header set Referrer-Policy "strict-origin-when-cross-origin"
  Header set Permissions-Policy "camera=(), microphone=(), geolocation=()"
  # Enable HSTS only after SSL is verified working on the final domain:
  # Header set Strict-Transport-Security "max-age=31536000; includeSubDomains"
</IfModule>

# Never serve the lead-routing config, even if someone uploads it here.
<FilesMatch "^lead-config">
  Require all denied
</FilesMatch>
