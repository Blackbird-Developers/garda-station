# Garda Station Solicitors - STAGING .htaccess (task #123yxuagbe8)
# Copied to dist/.htaccess by build.js when STAGING=1 (the default).
#
# Staging policy (handoff + hosting task): locked behind HTTP Basic Auth and
# noindexed - NOT a broken certificate. Learn from staging2, which shipped a
# self-signed CN=example.com SiteGround default cert.

Options -Indexes
ErrorDocument 404 /404.html

# Belt and braces on top of the per-page noindex meta and closed robots.txt.
<IfModule mod_headers.c>
  Header set X-Robots-Tag "noindex, nofollow"
  Header set X-Content-Type-Options "nosniff"
  Header set X-Frame-Options "SAMEORIGIN"
  Header set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>

# HTTP Basic Auth. On SiteGround, prefer Site Tools > Security > Protected
# URLs (it manages the htpasswd file for you). If doing it by hand instead,
# create the htpasswd file OUTSIDE the web root and enable:
#
# AuthType Basic
# AuthName "Garda Station Solicitors staging"
# AuthUserFile /home/customer/htpasswd/.htpasswd-garda-staging
# Require valid-user

RewriteEngine On
RewriteCond %{HTTPS} !=on
RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

<FilesMatch "^lead-config">
  Require all denied
</FilesMatch>
